[pytest]
pythonpath =
    libs/obs_common/src
    services/api-gateway
    services/ingestion-service
    services/trace-service
    services/log-service
    services/metrics-service
    services/rca-service
    services/query-service
    services/order-service
    services/payment-service
    services/notification-service
testpaths = services tests
addopts = --import-mode=importlib -p no:cacheprovider
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
markers =
    rabbitmq: needs a reachable RabbitMQ (RABBITMQ_URL); skipped otherwise
    compose: end-to-end test against a running docker compose stack (BASE_URL); skipped otherwise
